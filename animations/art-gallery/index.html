<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="top-container">
      <div class="mask">
        <h1>Fashion as art</h1>
      </div>
      <p>scroll down</p>
    </section>
    <main>
      <!-- art figure one -->
      <figure>
        <img
          src="./assets/Futuristic Motion Pose.png"
          alt="Futuristic motion pose"
        />
        <div class="line"></div>
        <figcaption>
          <div class="mask">
            <span class="caption-number">01</span>
          </div>
          <div class="mask">
            <span>Motion Pose</span>
          </div>
        </figcaption>
      </figure>
      <!-- art figure two -->
      <figure>
        <img
          src="./assets/Futuristic Portrait Art.png"
          alt="Futuristic Portrait art"
        />
        <div class="line"></div>
        <figcaption>
          <div class="mask">
            <span class="caption-number">02</span>
          </div>
          <div class="mask">
            <span>Portrait Art</span>
          </div>
        </figcaption>
      </figure>
      <!-- art figure three -->
      <figure>
        <img src="./assets/Futuristic Portrait.png" alt="Futuristic Glare" />
        <div class="line"></div>
        <figcaption>
          <div class="mask">
            <span class="caption-number">03</span>
          </div>
          <div class="mask">
            <span>Glare</span>
          </div>
        </figcaption>
      </figure>
      <!-- art figure four -->
      <figure>
        <img
          src="./assets/Glamorous Portrait with Metallic Sheen.png"
          alt="Metallic Bliss"
        />
        <div class="line"></div>
        <figcaption>
          <div class="mask">
            <span class="caption-number">04</span>
          </div>
          <div class="mask">
            <span>Metal Bliss</span>
          </div>
        </figcaption>
      </figure>
    </main>
    <script src="gsap.min.js"></script>
    <script src="ScrollTrigger.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
