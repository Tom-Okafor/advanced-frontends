<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Shoes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button class="display-direction">
      <img src="assets/columns-svgrepo-com.svg" alt="columns icon" />
      <p>columns</p>
    </button>
    <main class="product-list">
      <figure>
        <img
          src="assets/Close-up of Sneaker on Wooden Floor.png"
          alt="Close-up of a sneaker on a wooden floor"
        />
        <figcaption>
          <h3>Sneaker Royale</h3>
          <p>Wonderful and elegant</p>
        </figcaption>
      </figure>

      <figure>
        <img
          src="assets/Elegant Pink High-Heeled Shoe with Flowers.png"
          alt="Elegant pink high-heeled shoe with flowers"
        />
        <figcaption>
          <h3>Elegant Pink High-Heeled Shoe</h3>
          <p>Elegant and sophisticated</p>
        </figcaption>
      </figure>

      <figure>
        <img
          src="assets/Glossy Platform Boot.jpg"
          alt="Close-up of a glossy platform boot"
        />
        <figcaption>
          <h3>Glossy Platform Boot</h3>
          <p>Stylish and modern</p>
        </figcaption>
      </figure>

      <figure>
        <img
          src="assets/Red High-Heeled Shoe on Yellow Background.jpg"
          alt="Close-up of a red high-heeled shoe on a yellow background"
        />
        <figcaption>
          <h3>Red High-Heeled Shoe</h3>
          <p>Stylish and bold</p>
        </figcaption>
      </figure>

      <figure>
        <img
          src="assets/Stylish White Boot.jpg"
          alt="Close-up of a stylish white boot"
        />
        <figcaption>
          <h3>Stylish White Boot</h3>
          <p>Modern and sleek</p>
        </figcaption>
      </figure>
    </main>
    <script src="gsap.min.js"></script>
    <script src="Flip.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
